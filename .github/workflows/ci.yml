name: FraudShield CI/CD

on:
  push:
    branches:
      - cloudflare-deployment
      - main
  pull_request:
    branches:
      - cloudflare-deployment
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI and ML Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check featurizer imports
        working-directory: services/stream_processor
        run: python -c "from featurizer import FEATURE_NAMES, to_features; print('featurizer OK:', len(FEATURE_NAMES))"

      - name: Validate Python files
        run: |
          python -c "import ast; ast.parse(open('services/stream_processor/train.py').read()); print('train.py OK')"
          python -c "import ast; ast.parse(open('services/stream_processor/app.py').read()); print('app.py OK')"
          python -c "import ast; ast.parse(open('services/api/main.py').read()); print('API OK')"

      - name: Check ML libraries
        run: |
          python -c "import lightgbm; print('LightGBM OK')"
          python -c "import xgboost; print('XGBoost OK')"
          python -c "import shap; print('SHAP OK')"

      - name: Ensemble smoke test
        run: |
          python -c "
          import numpy as np
          from sklearn.ensemble import VotingClassifier
          from xgboost import XGBClassifier
          from lightgbm import LGBMClassifier

          X = np.random.randn(200, 29)
          y = np.random.randint(0, 2, 200)

          ens = VotingClassifier([
              ('xgb', XGBClassifier(n_estimators=5, verbosity=0, random_state=42)),
              ('lgbm', LGBMClassifier(n_estimators=5, verbose=-1, random_state=42))
          ], voting='soft')

          ens.fit(X, y)
          proba = ens.predict_proba(X[:5])[:, 1]
          assert proba.shape == (5,)
          assert np.all((proba >= 0) & (proba <= 1))
          print('Ensemble smoke test PASSED')
          "

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: services/ui
        run: npm ci

      - name: Build dashboard
        working-directory: services/ui
        run: npm run build

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]

    if: github.event_name == 'push' && github.ref == 'refs/heads/cloudflare-deployment'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: services/ui
        run: npm ci

      - name: Build production dashboard
        working-directory: services/ui
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: services/ui
        run: npx wrangler pages deploy dist --project-name fraudshield --branch cloudflare-deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed API
        run: curl --fail --retry 5 --retry-delay 5 --retry-connrefused https://fraudshield-9zx.pages.dev/api/health
